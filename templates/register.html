{% extends "base.html" %}

{% block title %}Register — Glint{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 580px;">
        <div class="auth-header">
            <div class="brand-badge" style="margin: 0 auto 1.25rem; width: 48px; height: 48px; font-size: 1.35rem;">GL</div>
            <h2 style="font-family: var(--font-display); font-size: 1.65rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.35rem;">
                Create Your Account
            </h2>
            <p style="color: var(--text-muted); font-size: 0.92rem;">Join the Glint campus placement network</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <!-- Account Type Switcher -->
            <div class="form-group">
                <label class="form-label">I am joining as a:</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;">
                    <label style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem; background: var(--bg-primary); border: 1.5px solid var(--border-medium); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.92rem; font-weight: 700; color: var(--text-main);">
                        <input type="radio" name="role" value="student" checked onchange="toggleRoleFields('student')" style="accent-color: var(--accent-coral);">
                        🎓 Student
                    </label>
                    <label style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem; background: var(--bg-primary); border: 1.5px solid var(--border-medium); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.92rem; font-weight: 700; color: var(--text-main);">
                        <input type="radio" name="role" value="recruiter" onchange="toggleRoleFields('recruiter')" style="accent-color: var(--accent-sage);">
                        🏢 Recruiter
                    </label>
                </div>
            </div>

            <!-- Common Fields -->
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.edu" required>
            </div>

            <!-- Student Specific Fields -->
            <div id="student-fields">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="roll_number" class="form-label">Roll Number</label>
                        <input type="text" id="roll_number" name="roll_number" class="form-control" placeholder="21CS001">
                    </div>
                    <div class="form-group">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" name="department_id" class="form-control">
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.code }} - {{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="cgpa" class="form-label">Current CGPA</label>
                        <input type="number" step="0.01" min="0" max="10" id="cgpa" name="cgpa" class="form-control" value="8.0">
                    </div>
                    <div class="form-group">
                        <label for="target_role" class="form-label">Target Role</label>
                        <input type="text" id="target_role" name="target_role" class="form-control" placeholder="e.g. Data Analyst">
                    </div>
                </div>
            </div>

            <!-- Recruiter Specific Fields -->
            <div id="recruiter-fields" style="display: none;">
                <div class="form-group">
                    <label for="company_id" class="form-label">Company Organization</label>
                    <select id="company_id" name="company_id" class="form-control">
                        {% for comp in companies %}
                            <option value="{{ comp.id }}">{{ comp.name }} ({{ comp.industry }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="designation" class="form-label">Your Designation</label>
                    <input type="text" id="designation" name="designation" class="form-control" placeholder="Talent Acquisition Lead">
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Work Phone</label>
                    <input type="text" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210">
                </div>
            </div>

            <!-- Passwords -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 chars" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem; font-size: 1rem;">
                <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
                Complete Registration
            </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="color: var(--accent-coral); text-decoration: none; font-weight: 700;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function toggleRoleFields(role) {
    const studentFields = document.getElementById("student-fields");
    const recruiterFields = document.getElementById("recruiter-fields");
    if (role === "student") {
        studentFields.style.display = "block";
        recruiterFields.style.display = "none";
    } else {
        studentFields.style.display = "none";
        recruiterFields.style.display = "block";
    }
}
</script>
{% endblock %}
